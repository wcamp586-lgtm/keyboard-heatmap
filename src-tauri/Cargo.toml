[package]
name = "keyboard-heatmap"
version = "0.1.3"
description = "A privacy-focused, local-only keyboard heatmap for Windows"
authors = ["wcamp586-lgtm <298943886+wcamp586-lgtm@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/wcamp586-lgtm/keyboard-heatmap"
edition = "2021"
rust-version = "1.77"

[lib]
name = "keyboard_heatmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
